{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            👤
        </div>

        <h1>
            Create Account
        </h1>

        <p>
            Join QuizMaster and start learning.
        </p>

        <form method="POST">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >

            <button type="submit"
                    class="btn primary full">
                Create Account
            </button>

        </form>

        <p class="auth-bottom">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>

{% endblock %}
