{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            👤
        </div>

        <h1>
            Create Account
        </h1>

        <p>
            Join QuizMaster and start learning.
        </p>

        <form id="registerForm">

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create password"
                minlength="6"
                required
            >

            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm password"
                minlength="6"
                required
            >

            <button
                type="submit"
                class="btn primary full"
            >
                Create Account
            </button>

        </form>

        <p
            id="registerMessage"
            class="form-message"
        ></p>

        <p class="auth-bottom">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</div>


<script>

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const confirmPassword =
                document
                    .getElementById("confirmPassword")
                    .value;

            const message =
                document
                    .getElementById("registerMessage");

            message.textContent = "";

            // -----------------------------------------
            // Check passwords
            // -----------------------------------------

            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                message.style.color =
                    "red";

                return;
            }

            // -----------------------------------------
            // Call API
            // -----------------------------------------

            try {

                const response =
                    await fetch(
                        "{{ url_for('api_register') }}",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                username: username,
                                email: email,
                                password: password
                            })
                        }
                    );

                const data =
                    await response.json();

                if (data.success) {

                    message.textContent =
                        data.message;

                    message.style.color =
                        "green";

                    setTimeout(
                        function() {

                            window.location.href =
                                data.redirect;

                        },
                        1000
                    );

                } else {

                    message.textContent =
                        data.message;

                    message.style.color =
                        "red";
                }

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to connect to server.";

                message.style.color =
                    "red";
            }

        }
    );

</script>

{% endblock %}
