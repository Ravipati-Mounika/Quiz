{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>Add Question</h1>

    <form method="POST">

        <input
            name="category"
            placeholder="Category"
            required
        >

        <input
            name="question"
            placeholder="Question"
            required
        >

        <input
            name="option1"
            placeholder="Option 1"
            required
        >

        <input
            name="option2"
            placeholder="Option 2"
            required
        >

        <input
            name="option3"
            placeholder="Option 3"
            required
        >

        <input
            name="option4"
            placeholder="Option 4"
            required
        >

        <input
            name="answer"
            placeholder="Correct Answer"
            required
        >

        <button class="btn">
            Add Question
        </button>

    </form>

</div>

{% endblock %}
