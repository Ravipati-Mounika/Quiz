{% extends "base.html" %}

{% block content %}

<div class="admin-container">

    <div class="page-heading">

        <h1>
            Add Quiz Question
        </h1>

        <p>
            Add new questions to the quiz database.
        </p>

    </div>


    <div class="admin-card">

        <form method="POST">

            <label>
                Category
            </label>

            <input
                type="text"
                name="category"
                placeholder="Example: Python"
                required
            >


            <label>
                Question
            </label>

            <textarea
                name="question"
                placeholder="Enter question"
                required
            ></textarea>


            <label>
                Option 1
            </label>

            <input
                type="text"
                name="option1"
                required
            >


            <label>
                Option 2
            </label>

            <input
                type="text"
                name="option2"
                required
            >


            <label>
                Option 3
            </label>

            <input
                type="text"
                name="option3"
                required
            >


            <label>
                Option 4
            </label>

            <input
                type="text"
                name="option4"
                required
            >


            <label>
                Correct Answer
            </label>

            <input
                type="text"
                name="answer"
                placeholder="Enter exact correct answer"
                required
            >


            <button
                type="submit"
                class="btn primary"
            >
                Add Question
            </button>

        </form>

    </div>


    <h2>
        Existing Questions
    </h2>


    <div class="admin-questions">

        {% for question in questions %}

        <div class="admin-question">

            <strong>
                {{ question.category }}
            </strong>

            <p>
                {{ question.question }}
            </p>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
