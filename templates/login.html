{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            🔐
        </div>

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to continue your quiz journey.
        </p>

        <form id="loginForm">

            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="submit"
                class="btn primary full"
            >
                Login
            </button>

        </form>

        <p
            id="loginMessage"
            class="form-message"
        ></p>

        <p class="auth-bottom">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register
            </a>

        </p>

    </div>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const message =
                document
                    .getElementById("loginMessage");

            message.textContent = "";

            try {

                const response =
                    await fetch(
                        "{{ url_for('api_login') }}",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );

                const data =
                    await response.json();

                if (data.success) {

                    message.textContent =
                        data.message;

                    message.style.color =
                        "green";

                    window.location.href =
                        data.redirect;

                } else {

                    message.textContent =
                        data.message;

                    message.style.color =
                        "red";
                }

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to connect to server.";

                message.style.color =
                    "red";
            }
        }
    );

</script>

{% endblock %}
