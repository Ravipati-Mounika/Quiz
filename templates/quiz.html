{% extends "base.html" %}

{% block content %}

<div class="quiz-container">

    <div class="quiz-header">

        <h1>
            {{ category }} Quiz
        </h1>

        <div id="timer">
            05:00
        </div>

    </div>

    <form
        method="POST"
        action="{{ url_for('submit_quiz') }}"
        id="quizForm"
    >

        <input
            type="hidden"
            name="category"
            value="{{ category }}"
        >

        {% for q in questions %}

        <div class="question-card">

            <h3>
                {{ loop.index }}.
                {{ q.question }}
            </h3>

            <label>
                <input
                    type="radio"
                    name="question_{{ q.id }}"
                    value="{{ q.option1 }}"
                    required
                >
                {{ q.option1 }}
            </label>

            <label>
                <input
                    type="radio"
                    name="question_{{ q.id }}"
                    value="{{ q.option2 }}"
                >
                {{ q.option2 }}
            </label>

            <label>
                <input
                    type="radio"
                    name="question_{{ q.id }}"
                    value="{{ q.option3 }}"
                >
                {{ q.option3 }}
            </label>

            <label>
                <input
                    type="radio"
                    name="question_{{ q.id }}"
                    value="{{ q.option4 }}"
                >
                {{ q.option4 }}
            </label>

        </div>

        {% endfor %}

        <button class="submit-btn">
            Submit Quiz
        </button>

    </form>

</div>

<script src="{{ url_for('static', filename='js/quiz.js') }}">
</script>

{% endblock %}
